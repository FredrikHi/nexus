services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: integration_observability
    ports:
      - "5433:5432"            # host 5433 -> container 5432 (avoids Cookly's 5432)
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the auth service's separate database on first initialisation.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d integration_observability"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build: ./apps/auth
    environment:
      AUTH_DATABASE_URL: postgres://postgres:postgres@postgres:5432/integration_observability_auth
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3001}
      AUTH_AUDIENCE: integration-observability-api
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:5173}
      # Required. Generate one with: openssl rand -hex 32
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Optional: sign-in with Google is offered only when both are present.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./apps/api
    environment:
      # Inside the compose network the DB is reached by service name "postgres".
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/integration_observability
      HOST: 0.0.0.0
      PORT: "8080"
      RUST_LOG: integration_api=debug,tower_http=debug,info
      # Who tokens must be issued by, and for. Both are checked on every
      # request: a valid signature is not enough if the token was minted for
      # a different application.
      AUTH_ISSUER: ${AUTH_BASE_URL:-http://localhost:3001}
      AUTH_AUDIENCE: integration-observability-api
      # Reached over the compose network rather than the published port.
      AUTH_JWKS_URL: http://auth:3001/api/auth/jwks
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_started   # wait until the DB passes its healthcheck

  web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - api
    profiles: ["full"]               # only starts with: docker compose --profile full up

volumes:
  pgdata:
