<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Nexus">
  <title>Nexus</title>
  <!--
    The letter N drawn as a graph: four nodes, three edges. The mark says what
    the product is about, which is the edges between things rather than the
    things themselves.
  -->
  <g fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round">
    <path d="M16 48 V16" />
    <path d="M16 16 L48 48" />
    <path d="M48 48 V16" />
  </g>
  <g fill="#34d399" stroke="#0a0a0a" stroke-width="3.5">
    <circle cx="16" cy="16" r="7" />
    <circle cx="16" cy="48" r="7" />
    <circle cx="48" cy="48" r="7" />
    <circle cx="48" cy="16" r="7" />
  </g>
</svg>
