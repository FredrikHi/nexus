<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Heavier strokes and larger nodes than the full mark: at 16px the thin
       version fills in and reads as a smudge. -->
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <g fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round">
    <path d="M20 46 V20" />
    <path d="M20 20 L44 46" />
    <path d="M44 46 V20" />
  </g>
  <g fill="#34d399">
    <circle cx="20" cy="20" r="5.5" />
    <circle cx="20" cy="46" r="5.5" />
    <circle cx="44" cy="46" r="5.5" />
    <circle cx="44" cy="20" r="5.5" />
  </g>
</svg>
