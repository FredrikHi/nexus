server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Forward API calls to the Rust service on the compose network.
  location /api/ {
    proxy_pass http://api:8080;
  }

  # SPA fallback: let React Router handle client-side routes.
  location / {
    try_files $uri /index.html;
  }
}
